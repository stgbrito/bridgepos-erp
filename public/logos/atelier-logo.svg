<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&amp;family=Montserrat:wght@300;400&amp;display=swap');
      .bg-clean { fill: #FAF9F6; }
      .brand-title { font-family: 'Bodoni Moda', serif; font-size: 34px; font-weight: 600; fill: #111111; letter-spacing: 12px; }
      .brand-sub { font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 400; fill: #B58A3E; letter-spacing: 18px; }
    </style>
    <linearGradient id="needleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
  </defs>

  <!-- Fondo Marfil Suave -->
  <rect width="100%" height="100%" class="bg-clean" rx="16" />

  <!-- Isotipo: Aguja de sastrería e hilo formando silueta de vestido -->
  <g transform="translate(400, 160)">
    <!-- Silueta del vestido formada por el hilo que cae del ojo -->
    <!-- Escote y talle -->
    <path d="M -22 -10 C -15 15, -12 25, -28 65 C -35 85, -45 105, -55 115 C -20 120, 20 120, 55 115 C 45 105, 35 85, 28 65 C 12 25, 15 15, 22 -10" fill="none" stroke="url(#needleGold)" stroke-width="2" stroke-linecap="round" />
    
    <!-- Cintura acentuada -->
    <path d="M -16 35 Q 0 40 16 35" fill="none" stroke="url(#needleGold)" stroke-width="1.5" stroke-dasharray="3 2" />

    <!-- Hilo que sale del ojo de la aguja y conecta al vestido -->
    <path d="M 0 -70 C -35 -50, -40 -30, -22 -10" fill="none" stroke="url(#needleGold)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 0 -70 C 35 -50, 40 -30, 22 -10" fill="none" stroke="url(#needleGold)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Aguja central vertical de costura -->
    <path d="M 0 -95 L 2.5 -40 L 0 50 L -2.5 -40 Z" fill="url(#needleGold)" />
    <!-- Ojo de la aguja -->
    <ellipse cx="0" cy="-70" rx="1.2" ry="5.5" fill="#FAF9F6" />
  </g>

  <!-- Tipografía: Solo Nombre y Atelier -->
  <text x="406" y="340" text-anchor="middle" class="brand-title">JUANA DE JESÚS</text>
  <text x="409" y="380" text-anchor="middle" class="brand-sub">ATELIER</text>
</svg>